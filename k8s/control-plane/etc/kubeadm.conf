# kubeadm configuration of the control plane: one file, several YAML documents
# separated by `---`, one per kind, as documented at
# https://kubernetes.io/docs/reference/config-api/kubeadm-config.v1beta4/
# The API versions are the current ones these components publish; none has a v1.
# Node name and advertise address are left to kubeadm, which takes the hostname
# and the IP of the default route. The bootstrap token is created after init.
apiVersion: kubeadm.k8s.io/v1beta4
kind: ClusterConfiguration
# Must match the kindest/node tag in the Dockerfile.
kubernetesVersion: v1.36.4
clusterName: hpc-lab
controlPlaneEndpoint: "k8s-control-plane:6443"
apiServer:
  certSANs: [localhost, "127.0.0.1", "k8s-control-plane"]
networking:
  # The CNI (kindnet) assigns a slice of podSubnet to every node; serviceSubnet
  # must not overlap it or the Docker network of the node containers.
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/16"
---
apiVersion: kubeadm.k8s.io/v1beta4
kind: InitConfiguration
nodeRegistration:
  criSocket: "unix:///run/containerd/containerd.sock"
skipPhases:
  - preflight
---
# Stored by kubeadm in the cluster; workers fetch it when they join.
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
cgroupDriver: systemd
cgroupRoot: /kubelet
failSwapOn: false
imageGCHighThresholdPercent: 100
evictionHard:
  nodefs.available: "0%"
  nodefs.inodesFree: "0%"
  imagefs.available: "0%"
---
apiVersion: kubeproxy.config.k8s.io/v1alpha1
kind: KubeProxyConfiguration
conntrack:
  maxPerCore: 0
