# Extra slurm.conf settings for the cluster. The Slinky operator generates the
# base configuration (cluster name, controller host, authentication, nodes and
# partitions) from slurm/values/slurm.yaml; slurm-deploy passes this file to the
# chart as controller.extraConf, which appends it to the generated slurm.conf.
# Reference: https://slurm.schedmd.com/slurm.conf.html

# Keep finished jobs visible to scontrol and squeue for ten minutes.
MinJobAge=600
# Backfill scheduling with cores and memory as consumable resources.
SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory
