name: hpc-lab

# Settings shared by the Kubernetes node services (a YAML anchor each one
# merges with `<<:`). The flags are the ones the kind CLI uses for kindest/node;
# state lives in anonymous volumes so a container recreate keeps the cluster.
# Chef configures the image at build and runs kubeadm on first boot; the cookbook
# is mounted so a runtime converge uses the working copy.
x-kubernetes-node: &kubernetes-node
  build: kubernetes
  # systemd, containerd and kubelet mount filesystems, manage cgroups and create
  # network namespaces; the default seccomp and AppArmor profiles block them.
  privileged: true
  cgroup: private
  security_opt:
    - seccomp:unconfined
    - apparmor:unconfined
  restart: on-failure:1
  # systemd wants a writable /run and the runtime scratches in /tmp; neither persists.
  tmpfs:
    - /tmp
    - /run

services:
  admin:
    build: admin
    restart: unless-stopped
    # The entrypoint converges the cookbook (packages, kubectl, helm, lab scripts)
    # before starting sshd, so a listening sshd means the lab scripts are installed;
    # `make start-kubernetes` waits for it with `docker compose up --wait`.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/22"]
      interval: 5s
      timeout: 3s
      retries: 60
    ports:
      - "127.0.0.1:2200:22"
    volumes:
      - kubeconfig:/root/.kube
      - ./admin/ssh:/opt/hpc-lab/ssh:ro
      - ./admin/cookbook:/opt/hpc-lab/chef/cookbooks/hpc-lab-admin:ro
      - ./slurm/cookbook:/opt/hpc-lab/chef/cookbooks/hpc-lab-slurm:ro
    depends_on:
      - kubernetes-control-plane

  kubernetes-control-plane:
    <<: *kubernetes-node
    # Docker's default hostname is the container id; kubelet names the node after it.
    hostname: kubernetes-control-plane
    ports:
      - "127.0.0.1:6443:6443"  # Kubernetes API
    volumes:
      - /var
      - /etc/kubernetes
      - /lib/modules:/lib/modules:ro
      - ./kubernetes/.env.secrets.local:/opt/hpc-lab/kubernetes.secrets.env:ro
      - ./kubernetes/cookbook:/opt/hpc-lab/chef/cookbooks/hpc-lab-kubernetes:ro
      - kubeconfig:/output
      - shared:/shared

  # The workers are replicas of this one service: `make start-kubernetes workers=N`
  # scales it. Each replica joins as kubernetes-worker-<index>, its compose container
  # index. The Slinky operator runs at most one slurmd pod per Kubernetes node,
  # so there is one worker per Slurm compute node: 2 in main, 2 in main-gpu.
  kubernetes-worker:
    <<: *kubernetes-node
    deploy:
      replicas: 4
    depends_on:
      - kubernetes-control-plane
    volumes:
      - /var
      - /etc/kubernetes
      - /lib/modules:/lib/modules:ro
      - ./kubernetes/.env.secrets.local:/opt/hpc-lab/kubernetes.secrets.env:ro
      - ./kubernetes/cookbook:/opt/hpc-lab/chef/cookbooks/hpc-lab-kubernetes:ro
      - shared:/shared

  # The Slurm Simulator: Slurm's own controller replays a workload on a simulated
  # clock, to compare scheduling policies without a cluster (make simulate-slurm).
  # It needs nothing else of the lab and no privileges, and has a lifecycle of its
  # own: the profile leaves it out of every compose command that does not name it
  # (`docker compose up`, `build`, `stop`), so the lab targets do not touch it but
  # make clean, which destroys everything, and the make targets *-slurm-simulator
  # manage it.
  slurm-simulator:
    build: slurm-simulator
    profiles: [slurm-simulator]
    restart: unless-stopped
    # An init process as PID 1 reaps the daemons of a simulation that lose their
    # parent when it fails; MariaDB, the main process, would leave them as zombies.
    init: true
    # The entrypoint converges the cookbook (packages, the simulator build, the
    # simulated cluster) before starting MariaDB, so a responding MariaDB means the
    # simulator is ready. The first start builds the simulator, a few minutes, which
    # the start period allows for.
    healthcheck:
      test: ["CMD", "mysqladmin", "--silent", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 20m
    volumes:
      - ./slurm-simulator/cookbook:/opt/hpc-lab/chef/cookbooks/hpc-lab-slurm-simulator:ro
      - ./slurm-simulator/workloads:/opt/hpc-lab/slurm-simulator/workloads:ro
      - ./slurm-simulator/plugins:/opt/hpc-lab/slurm-simulator/plugins:ro
      - ./slurm-simulator/configs:/opt/hpc-lab/slurm-simulator/configs:ro
      - ./slurm-simulator/results:/opt/hpc-lab/slurm-simulator/results
    # Its own network: it talks to nothing else of the lab, and needs nothing of it.
    networks: [slurm-simulator]

networks:
  slurm-simulator:  # the Slurm Simulator alone; it talks to nothing else of the lab

volumes:
  kubeconfig:  # admin kubeconfig, written by the control plane and read by the admin container
  shared:      # /shared on every Kubernetes node, mounted by the Slurm pods as the cluster-wide shared directory
