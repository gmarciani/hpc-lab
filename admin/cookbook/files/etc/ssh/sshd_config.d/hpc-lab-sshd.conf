# Root is the only account in the container; it logs in with the key the
# Makefile generates, never with a password.
PermitRootLogin prohibit-password
# Key authentication only: no password or keyboard prompts on the published port.
PasswordAuthentication no
KbdInteractiveAuthentication no
# The entrypoint installs the lab public key here from the mounted admin/ssh folder.
AuthorizedKeysFile /root/.ssh/authorized_keys
